[package]
name = "dbpinball"
version = "0.1.0"
description = "CLI-first database developer workspace for MySQL and PostgreSQL"
authors = ["programinglive"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dbpinball_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
dbpinball-core = { path = "../crates/dbpinball-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "io-util"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "mysql", "chrono", "rust_decimal", "json"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
async-compression = { version = "0.4", features = ["tokio", "deflate"] }
keyring = "2"
which = "5"
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }

