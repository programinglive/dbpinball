# Disposable databases for the dbpinball-core integration tests.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   DBPINBALL_TEST_PG_URL=postgres://postgres:dbpinball@127.0.0.1:55432/dbpinball_test \
#   DBPINBALL_TEST_MYSQL_URL=mysql://root:dbpinball@127.0.0.1:53306/dbpinball_test \
#     cargo test -p dbpinball-core --features integration
#   docker compose -f docker-compose.test.yml down -v
#
# The credentials here are synthetic and only valid inside these containers.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dbpinball
      POSTGRES_DB: dbpinball_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dbpinball_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: dbpinball
      MYSQL_DATABASE: dbpinball_test
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdbpinball"]
      interval: 2s
      timeout: 2s
      retries: 30
