[package]
name = "dbpinball-cli"
version = "0.1.6"
edition = "2021"
license = "MIT"
description = "Standalone CLI for DBPinball"

[[bin]]
name = "dbpinball"
path = "src/main.rs"

[dependencies]
dbpinball-core = { path = "../dbpinball-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rpassword = "7"
which = "5"

[dev-dependencies]
tempfile = "3"
url = "2"

[features]
integration = []
