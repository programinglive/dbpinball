[package]
name = "dbpinball-cli"
version = "0.1.8"
edition = "2021"
license = "MIT"
description = "Standalone CLI for DBPinball"

[[bin]]
name = "dbpinball"
path = "src/main.rs"

[dependencies]
dbpinball-core = { path = "../dbpinball-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rpassword = "7"
which = "8"

[dev-dependencies]
tempfile = "3"
url = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-native-tls", "postgres"] }

[build-dependencies]
winresource = "0.1"

[features]
integration = []
