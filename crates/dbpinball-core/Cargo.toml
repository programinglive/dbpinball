[package]
name = "dbpinball-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Headless database services for DBPinball"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "mysql", "chrono", "rust_decimal", "json"] }
keyring = "2"
dirs = "5"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
url = "2"
tempfile = "3"

[features]
integration = []
