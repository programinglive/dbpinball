name: Docs

# Builds the documentation site and deploys it to Cloudflare Pages.
#
# Production deployment runs only from `main`. A pull request builds and link-
# checks the site but never deploys, so an untrusted branch cannot publish.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and link-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        run: npm run build

      - name: Check internal links
        working-directory: website
        run: node scripts/check-links.mjs

      - name: Check code-block contrast
        working-directory: website
        run: node scripts/check-contrast.mjs

      - name: Check layout wrappers
        working-directory: website
        run: node scripts/check-layout.mjs

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: website/.vitepress/dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: docs-production
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: dist

      # The deploy needs a durable API token. A missing credential is an
      # actionable failure, not a silent skip: the build job stays green and
      # independent, while this job reports exactly what is missing.
      - name: Check deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::Documentation deployment is blocked: missing repository secret(s):$missing. Add them under Settings -> Secrets and variables -> Actions. The site keeps its last successful deployment."
            exit 1
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dbpinball-docs --branch=main