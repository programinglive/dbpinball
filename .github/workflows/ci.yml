name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check dependency boundaries
        run: node scripts/check-boundaries.cjs

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  php:
    name: PHP / Laravel Adapter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/laravel-adapter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit

  database-integration:
    name: Database integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dbpinball_root
          POSTGRES_DB: dbpinball_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dbpinball_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dbpinball_root
          MYSQL_DATABASE: dbpinball_test
          MYSQL_USER: dbpinball
          MYSQL_PASSWORD: dbpinball_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -udbpinball -pdbpinball_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The tests must not run as a superuser. Create a role scoped to the
      # disposable test database with only CONNECT, USAGE, and CREATE.
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create least-privilege PostgreSQL role
        env:
          PGPASSWORD: dbpinball_root
        run: |
          psql -h 127.0.0.1 -U postgres -d dbpinball_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE dbpinball LOGIN PASSWORD 'dbpinball_test';
          GRANT CONNECT ON DATABASE dbpinball_test TO dbpinball;
          GRANT USAGE, CREATE ON SCHEMA public TO dbpinball;
          SQL

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # Ephemeral service containers are torn down by the runner after the job.
      - name: Run core database integration tests
        env:
          DBPINBALL_TEST_PG_URL: postgres://dbpinball:dbpinball_test@127.0.0.1:5432/dbpinball_test
          DBPINBALL_TEST_MYSQL_URL: mysql://dbpinball:dbpinball_test@127.0.0.1:3306/dbpinball_test
        run: cargo test -p dbpinball-core --features integration --test inspect_integration -- --nocapture

      - name: Run M3 security verifier integration tests
        env:
          DBPINBALL_TEST_PG_URL: postgres://dbpinball:dbpinball_test@127.0.0.1:5432/dbpinball_test
          DBPINBALL_TEST_MYSQL_URL: mysql://dbpinball:dbpinball_test@127.0.0.1:3306/dbpinball_test
        # These must actually run: a skipped suite is not engine verification.
        run: cargo test -p dbpinball-core --features integration --test security_integration -- --nocapture

      - name: Run CLI database integration tests
        env:
          DBPINBALL_TEST_PG_URL: postgres://dbpinball:dbpinball_test@127.0.0.1:5432/dbpinball_test
          DBPINBALL_TEST_MYSQL_URL: mysql://dbpinball:dbpinball_test@127.0.0.1:3306/dbpinball_test
        run: cargo test -p dbpinball-cli --features integration --test cli_integration -- --nocapture

  # M4 Slice 1 needs two isolated clusters: a restricted source and a writable
  # destination. Sharing one cluster would not prove that identity binding is
  # enforced across servers.
  safesync-integration:
    name: Safe Sync integration (two clusters)
    runs-on: ubuntu-latest
    services:
      source:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: m4owner
          POSTGRES_PASSWORD: m4owner
          POSTGRES_DB: srcdb
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U m4owner -d srcdb"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 40
      destination:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: m4dst
          POSTGRES_PASSWORD: m4dst
          POSTGRES_DB: dstdb
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U m4dst -d dstdb"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # The source role is deliberately SELECT-only: a superuser source must be
      # refused, so the tests need a genuinely restricted role plus a separate
      # superuser URL for the refusal fixtures.
      - name: Create the restricted source role and fixtures
        env:
          PGPASSWORD: m4owner
        run: |
          psql -h 127.0.0.1 -p 55433 -U m4owner -d srcdb -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE m4src LOGIN PASSWORD 'm4src';
          GRANT CONNECT ON DATABASE srcdb TO m4src;
          GRANT USAGE ON SCHEMA public TO m4src;
          CREATE TABLE public.accounts (
            id uuid PRIMARY KEY,
            email text NOT NULL,
            full_name text NOT NULL
          );
          INSERT INTO public.accounts VALUES
            ('0b9f4c3e-0000-0000-0000-000000000001', 'alice@example.com', 'Alice Example'),
            ('0b9f4c3e-0000-0000-0000-000000000002', 'bob@example.com', 'Bob Example'),
            ('0b9f4c3e-0000-0000-0000-000000000003', 'carol@example.com', 'Carol Example');
          GRANT SELECT ON public.accounts TO m4src;
          -- S2-a graph fixtures.
          CREATE TABLE public.customers (
            code text PRIMARY KEY, email text NOT NULL, name text NOT NULL
          );
          CREATE TABLE public.orders (
            id uuid PRIMARY KEY,
            customer_code text REFERENCES public.customers(code),
            note text NOT NULL
          );
          CREATE TABLE public.shipments (
            region text NOT NULL, code text NOT NULL, label text NOT NULL,
            PRIMARY KEY (region, code)
          );
          CREATE TABLE public.shipment_events (
            region text NOT NULL, code text NOT NULL, detail text NOT NULL,
            PRIMARY KEY (region, code),
            FOREIGN KEY (region, code) REFERENCES public.shipments(region, code)
          );
          CREATE TABLE public.employees (
            id text PRIMARY KEY,
            manager_id text REFERENCES public.employees(id) DEFERRABLE INITIALLY DEFERRED,
            name text NOT NULL
          );
          CREATE TABLE public.cycle_a (id text PRIMARY KEY, b_id text);
          CREATE TABLE public.cycle_b (id text PRIMARY KEY, a_id text);
          ALTER TABLE public.cycle_a ADD CONSTRAINT cycle_a_b
            FOREIGN KEY (b_id) REFERENCES public.cycle_b(id) DEFERRABLE INITIALLY DEFERRED;
          ALTER TABLE public.cycle_b ADD CONSTRAINT cycle_b_a
            FOREIGN KEY (a_id) REFERENCES public.cycle_a(id) DEFERRABLE INITIALLY DEFERRED;
          CREATE TABLE public.cycle_x (id text PRIMARY KEY, y_id text);
          CREATE TABLE public.cycle_y (id text PRIMARY KEY, x_id text);
          ALTER TABLE public.cycle_x ADD CONSTRAINT cycle_x_y
            FOREIGN KEY (y_id) REFERENCES public.cycle_y(id);
          ALTER TABLE public.cycle_y ADD CONSTRAINT cycle_y_x
            FOREIGN KEY (x_id) REFERENCES public.cycle_x(id);
          INSERT INTO public.customers VALUES
            ('C1', 'alice@example.com', 'Alice Example'),
            ('C2', 'bob@example.com', 'Bob Example');
          INSERT INTO public.orders VALUES
            ('0b9f4c3e-0000-0000-0000-000000000001', 'C1', 'note one'),
            ('0b9f4c3e-0000-0000-0000-000000000002', 'C2', 'note two'),
            ('0b9f4c3e-0000-0000-0000-000000000003', 'C1', 'note three'),
            ('0b9f4c3e-0000-0000-0000-000000000004', NULL, 'note four');
          INSERT INTO public.shipments VALUES ('EU', 'S1', 'eu one'), ('US', 'S2', 'us one');
          INSERT INTO public.shipment_events VALUES ('EU', 'S1', 'event one');
          INSERT INTO public.employees VALUES ('E1', NULL, 'Boss Example'), ('E2', 'E1', 'Worker Example');
          BEGIN;
          SET CONSTRAINTS ALL DEFERRED;
          INSERT INTO public.cycle_a VALUES ('A1', 'B1');
          INSERT INTO public.cycle_b VALUES ('B1', 'A1');
          COMMIT;
          INSERT INTO public.cycle_y VALUES ('Y1', NULL);
          INSERT INTO public.cycle_x VALUES ('X1', 'Y1');
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO m4src;
          -- RLS-hidden parent fixture.
          CREATE TABLE public.rls_parents (id text PRIMARY KEY, name text NOT NULL);
          CREATE TABLE public.rls_children (
            id text PRIMARY KEY,
            parent_id text NOT NULL REFERENCES public.rls_parents(id)
          );
          INSERT INTO public.rls_parents VALUES ('R1', 'Visible Parent'), ('R2', 'Hidden Parent');
          INSERT INTO public.rls_children VALUES ('C1', 'R1'), ('C2', 'R2');
          GRANT SELECT ON public.rls_parents, public.rls_children TO m4src;
          ALTER TABLE public.rls_parents ENABLE ROW LEVEL SECURITY;
          CREATE POLICY rls_visible ON public.rls_parents FOR SELECT TO m4src USING (id = 'R1');
          -- Identity and generated column fixture.
          CREATE TABLE public.identity_parents (
            id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            code text NOT NULL,
            full_label text GENERATED ALWAYS AS (code || ':' || id) STORED
          );
          CREATE TABLE public.identity_children (
            id uuid PRIMARY KEY,
            parent_id bigint NOT NULL REFERENCES public.identity_parents(id)
          );
          INSERT INTO public.identity_parents (code) VALUES ('A'), ('B');
          INSERT INTO public.identity_children VALUES
            ('0b9f4c3e-0000-0000-0000-0000000000c1', 1),
            ('0b9f4c3e-0000-0000-0000-0000000000c2', 2);
          GRANT SELECT ON public.identity_parents, public.identity_children TO m4src;
          SQL

      - name: Create the destination fixture
        env:
          PGPASSWORD: m4dst
        run: |
          psql -h 127.0.0.1 -p 55434 -U m4dst -d dstdb -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.accounts (
            id uuid PRIMARY KEY,
            email text NOT NULL,
            full_name text NOT NULL
          );
          CREATE TABLE public.customers (
            code text PRIMARY KEY, email text NOT NULL, name text NOT NULL
          );
          CREATE TABLE public.orders (
            id uuid PRIMARY KEY,
            customer_code text REFERENCES public.customers(code),
            note text NOT NULL
          );
          CREATE TABLE public.shipments (
            region text NOT NULL, code text NOT NULL, label text NOT NULL,
            PRIMARY KEY (region, code)
          );
          CREATE TABLE public.shipment_events (
            region text NOT NULL, code text NOT NULL, detail text NOT NULL,
            PRIMARY KEY (region, code),
            FOREIGN KEY (region, code) REFERENCES public.shipments(region, code)
          );
          CREATE TABLE public.employees (
            id text PRIMARY KEY,
            manager_id text REFERENCES public.employees(id) DEFERRABLE INITIALLY DEFERRED,
            name text NOT NULL
          );
          CREATE TABLE public.cycle_a (id text PRIMARY KEY, b_id text);
          CREATE TABLE public.cycle_b (id text PRIMARY KEY, a_id text);
          ALTER TABLE public.cycle_a ADD CONSTRAINT cycle_a_b
            FOREIGN KEY (b_id) REFERENCES public.cycle_b(id) DEFERRABLE INITIALLY DEFERRED;
          ALTER TABLE public.cycle_b ADD CONSTRAINT cycle_b_a
            FOREIGN KEY (a_id) REFERENCES public.cycle_a(id) DEFERRABLE INITIALLY DEFERRED;
          CREATE TABLE public.cycle_x (id text PRIMARY KEY, y_id text);
          CREATE TABLE public.cycle_y (id text PRIMARY KEY, x_id text);
          ALTER TABLE public.cycle_x ADD CONSTRAINT cycle_x_y
            FOREIGN KEY (y_id) REFERENCES public.cycle_y(id);
          ALTER TABLE public.cycle_y ADD CONSTRAINT cycle_y_x
            FOREIGN KEY (x_id) REFERENCES public.cycle_x(id);
          CREATE TABLE public.rls_parents (id text PRIMARY KEY, name text NOT NULL);
          CREATE TABLE public.rls_children (
            id text PRIMARY KEY,
            parent_id text NOT NULL REFERENCES public.rls_parents(id)
          );
          CREATE TABLE public.identity_parents (
            id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            code text NOT NULL,
            full_label text GENERATED ALWAYS AS (code || ':' || id) STORED
          );
          CREATE TABLE public.identity_children (
            id uuid PRIMARY KEY,
            parent_id bigint NOT NULL REFERENCES public.identity_parents(id)
          );
          SQL

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Run core Safe Sync integration tests
        env:
          DBPINBALL_TEST_PG_SOURCE_URL: postgres://m4src:m4src@127.0.0.1:55433/srcdb
          DBPINBALL_TEST_PG_DEST_URL: postgres://m4dst:m4dst@127.0.0.1:55434/dstdb
          DBPINBALL_TEST_PG_SUPER_URL: postgres://m4owner:m4owner@127.0.0.1:55433/srcdb
        run: |
          set -euo pipefail
          cargo test -p dbpinball-core --features integration --test safesync_integration -- --nocapture | tee /tmp/safesync-core.log
          # A skipped suite reports zero tests; that is not acceptance.
          ! grep -q "test result: ok. 0 passed" /tmp/safesync-core.log

      - name: Run FK graph Safe Sync integration tests
        env:
          DBPINBALL_TEST_PG_SOURCE_URL: postgres://m4src:m4src@127.0.0.1:55433/srcdb
          DBPINBALL_TEST_PG_DEST_URL: postgres://m4dst:m4dst@127.0.0.1:55434/dstdb
          DBPINBALL_TEST_PG_SUPER_URL: postgres://m4owner:m4owner@127.0.0.1:55433/srcdb
        run: |
          set -euo pipefail
          cargo test -p dbpinball-core --features integration --test safesync_graph_integration -- --nocapture | tee /tmp/safesync-graph.log
          ! grep -q "test result: ok. 0 passed" /tmp/safesync-graph.log

      - name: Run CLI Safe Sync acceptance tests
        env:
          DBPINBALL_TEST_PG_SOURCE_URL: postgres://m4src:m4src@127.0.0.1:55433/srcdb
          DBPINBALL_TEST_PG_DEST_URL: postgres://m4dst:m4dst@127.0.0.1:55434/dstdb
          DBPINBALL_TEST_PG_SUPER_URL: postgres://m4owner:m4owner@127.0.0.1:55433/srcdb
        run: |
          set -euo pipefail
          cargo test -p dbpinball-cli --features integration --test safesync_cli_integration -- --nocapture | tee /tmp/safesync-cli.log
          ! grep -q "test result: ok. 0 passed" /tmp/safesync-cli.log

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high and above)
        run: npm audit --audit-level=high

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Pinned so the advisory database and exit-code behaviour do not drift.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0

      # Runs from the workspace root so cargo-audit reads .cargo/audit.toml,
      # which is the single source of truth for accepted advisories.
      - name: Rust advisory audit
        run: cargo audit

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action requires a paid GITLEAKS_LICENSE for organizations.
      # This repository is owned by an organization, so the pinned binary is
      # used instead: no license, no extra secret, checksum verified.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan repository history
        run: gitleaks detect --source . --no-banner --redact --exit-code 1
