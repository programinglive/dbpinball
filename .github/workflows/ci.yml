name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check dependency boundaries
        run: node scripts/check-boundaries.cjs

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  php:
    name: PHP / Laravel Adapter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/laravel-adapter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit

  database-integration:
    name: Database integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dbpinball_root
          POSTGRES_DB: dbpinball_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dbpinball_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dbpinball_root
          MYSQL_DATABASE: dbpinball_test
          MYSQL_USER: dbpinball
          MYSQL_PASSWORD: dbpinball_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -udbpinball -pdbpinball_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The tests must not run as a superuser. Create a role scoped to the
      # disposable test database with only CONNECT, USAGE, and CREATE.
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create least-privilege PostgreSQL role
        env:
          PGPASSWORD: dbpinball_root
        run: |
          psql -h 127.0.0.1 -U postgres -d dbpinball_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE dbpinball LOGIN PASSWORD 'dbpinball_test';
          GRANT CONNECT ON DATABASE dbpinball_test TO dbpinball;
          GRANT USAGE, CREATE ON SCHEMA public TO dbpinball;
          SQL

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # Ephemeral service containers are torn down by the runner after the job.
      - name: Run database integration tests
        env:
          DBPINBALL_TEST_PG_URL: postgres://dbpinball:dbpinball_test@127.0.0.1:5432/dbpinball_test
          DBPINBALL_TEST_MYSQL_URL: mysql://dbpinball:dbpinball_test@127.0.0.1:3306/dbpinball_test
        run: cargo test -p dbpinball-core --features integration --test inspect_integration -- --nocapture

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high and above)
        run: npm audit --audit-level=high

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Pinned so the advisory database and exit-code behaviour do not drift.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0

      # Runs from the workspace root so cargo-audit reads .cargo/audit.toml,
      # which is the single source of truth for accepted advisories.
      - name: Rust advisory audit
        run: cargo audit

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action requires a paid GITLEAKS_LICENSE for organizations.
      # This repository is owned by an organization, so the pinned binary is
      # used instead: no license, no extra secret, checksum verified.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan repository history
        run: gitleaks detect --source . --no-banner --redact --exit-code 1
