name: Package

# Builds installable artifacts and uploads them as workflow artifacts.
#
# This workflow never publishes a release and never creates a tag. Publishing is
# a separate, explicitly authorized action; until then the artifacts are
# downloadable from the workflow run only.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "src-tauri/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/package.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "src-tauri/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/package.yml"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (installer + CLI)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install dependencies
        run: npm ci

      - name: Build artifacts
        shell: pwsh
        env:
          # On a pull_request event github.sha is the ephemeral merge commit, so
          # record the real head instead. A push to main has no pull_request
          # payload and falls back to github.sha.
          DBPINBALL_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/package-windows.ps1

      - name: Verify the packaged CLI runs
        shell: pwsh
        run: |
          $exe = "target/cli-dist/release/dbpinball.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "dbpinball --version failed" }
          & $exe doctor --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "dbpinball doctor failed" }

      - name: Verify the CLI archive installs and resolves from PATH
        shell: pwsh
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $zip = "artifacts/release/v$version/dbpinball-cli-$version-x64.zip"
          $extract = "artifacts/verify/cli"
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $envKey = 'HKCU:\Environment'
          $before = [string](Get-Item $envKey).GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $installDir = Join-Path $env:LOCALAPPDATA 'dbpinball/bin'
          $hasEntry = {
            param([string]$value)
            [bool](($value -split ';') | Where-Object { $_.TrimEnd('\') -ieq $installDir.TrimEnd('\') })
          }
          if (& $hasEntry $before) {
            throw "the runner already has $installDir on its user PATH, so the add/remove cycle cannot be proven"
          }

          & "$extract/install-cli.ps1" -Quiet
          if ($LASTEXITCODE -ne 0) { throw "install-cli.ps1 failed" }

          $after = [string](Get-Item $envKey).GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          if (-not (& $hasEntry $after)) { throw "the installer did not add $installDir to the user PATH" }

          # Resolve the command the way a new terminal would: from the persisted
          # user PATH, not from an absolute path.
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $env:PATH = "$after;$machinePath"
          $resolved = (Get-Command dbpinball -ErrorAction SilentlyContinue)
          if (-not $resolved) { throw "dbpinball does not resolve from the persisted user PATH" }
          if ($resolved.Source -notlike "*dbpinball\bin\dbpinball.exe") {
            throw "dbpinball resolved to an unexpected file: $($resolved.Source)"
          }
          dbpinball --version
          if ($LASTEXITCODE -ne 0) { throw "the installed CLI did not run" }
          dbpinball --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "dbpinball --help failed" }

          # A reinstall must keep ownership, so the uninstall below still removes
          # the entry the first install added.
          & "$extract/install-cli.ps1" -Quiet
          if ($LASTEXITCODE -ne 0) { throw "the reinstall failed" }

          & "$extract/install-cli.ps1" -Uninstall -Quiet
          if ($LASTEXITCODE -ne 0) { throw "install-cli.ps1 -Uninstall failed" }
          $restored = [string](Get-Item $envKey).GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          if (& $hasEntry $restored) { throw "uninstall left $installDir on the user PATH" }
          if ($restored -cne $before) {
            throw "uninstall did not restore the original user PATH`nbefore: $before`nafter:  $restored"
          }

      - name: Verify checksums
        shell: pwsh
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $dir = "artifacts/release/v$version"
          $lines = @(Get-Content "$dir/SHA256SUMS.txt" | Where-Object { $_ -match '^[0-9a-f]{64}\s+' })
          $expected = @(
            "dbpinball_${version}_x64-setup.exe",
            "dbpinball-cli-$version-x64.zip"
          )
          $names = @($lines | ForEach-Object { ($_ -split '\s+', 2)[1] })
          foreach ($name in $expected) {
            if (-not ($names -ccontains $name)) {
              throw "SHA256SUMS.txt has no line for $name"
            }
          }
          # Reject anything that is not part of this release, so a stale file
          # from an earlier run cannot be uploaded alongside the artifacts.
          $allowed = @($expected) + @("SHA256SUMS.txt", "provenance.json")
          $present = @(Get-ChildItem -LiteralPath $dir -File | Select-Object -ExpandProperty Name)
          $extra = @($present | Where-Object { $allowed -notcontains $_ })
          if ($extra.Count -gt 0) {
            throw "unexpected files in the release directory: $($extra -join ', ')"
          }
          foreach ($line in $lines) {
            if ($line -match '^([0-9a-f]{64})\s+(.+)$') {
              $expected = $Matches[1]
              $file = Join-Path $dir $Matches[2]
              if (-not (Test-Path -LiteralPath $file)) { throw "checksummed file is missing: $file" }
              $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $expected) { throw "checksum mismatch for $file" }
            }
          }

      - name: Verify the upload set is complete
        shell: pwsh
        run: |
          $dir = "artifacts/release/v$env:RELEASE_VERSION"
          $expected = @(
            "dbpinball_$($env:RELEASE_VERSION)_x64-setup.exe",
            "dbpinball-cli-$($env:RELEASE_VERSION)-x64.zip",
            "SHA256SUMS.txt",
            "provenance.json"
          )
          foreach ($name in $expected) {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $name))) {
              throw "missing release file: $name"
            }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbpinball-windows-x64
          # Upload only the files this release produced, not everything under
          # artifacts/release: a stale file from another run must never ship.
          path: |
            artifacts/release/v${{ env.RELEASE_VERSION }}/dbpinball_${{ env.RELEASE_VERSION }}_x64-setup.exe
            artifacts/release/v${{ env.RELEASE_VERSION }}/dbpinball-cli-${{ env.RELEASE_VERSION }}-x64.zip
            artifacts/release/v${{ env.RELEASE_VERSION }}/SHA256SUMS.txt
            artifacts/release/v${{ env.RELEASE_VERSION }}/provenance.json
          if-no-files-found: error

  linux:
    name: Linux x64 (CLI + Desktop packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install dependencies
        run: npm ci

      - name: Build the CLI
        run: |
          set -euo pipefail
          # The Desktop app and the CLI both produce `dbpinball`; a shared
          # target directory lets one overwrite the other.
          CARGO_TARGET_DIR=target/cli-dist cargo build -p dbpinball-cli --release --locked

      - name: Verify the CLI runs
        run: |
          set -euo pipefail
          ./target/cli-dist/release/dbpinball --version
          ./target/cli-dist/release/dbpinball doctor --json > /dev/null

      - name: Build the Desktop packages
        run: npm run tauri build -- --bundles deb,appimage

      - name: Assemble artifacts
        env:
          # On a pull_request event github.sha is the ephemeral merge commit, so
          # record the real head instead.
          DBPINBALL_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          out="artifacts/release/v$version"
          # Start from an empty directory so a file from an earlier run cannot
          # travel with this release.
          rm -rf "$out"
          mkdir -p "$out"
          # MIT and Apache-2.0 both require the notices to travel with a binary
          # distribution, so the tarball carries them next to the binary.
          tar -C target/cli-dist/release -cf "$out/dbpinball-cli-$version-x64-linux.tar" dbpinball
          tar -rf "$out/dbpinball-cli-$version-x64-linux.tar" --transform 's|^|dbpinball-notices/|' LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md
          gzip -f "$out/dbpinball-cli-$version-x64-linux.tar"

          # The workspace target directory is the repository's `target`, not
          # `src-tauri/target`. Fail loudly instead of uploading a CLI-only set.
          deb=$(ls target/release/bundle/deb/*.deb 2>/dev/null | head -n 1 || true)
          appimage=$(ls target/release/bundle/appimage/*.AppImage 2>/dev/null | head -n 1 || true)
          if [ -z "$deb" ]; then echo "no .deb was produced" >&2; exit 1; fi
          if [ -z "$appimage" ]; then echo "no AppImage was produced" >&2; exit 1; fi
          cp "$deb" "$out/"
          cp "$appimage" "$out/"

          cd "$out"
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

          commit="${DBPINBALL_BUILD_COMMIT:-$(git rev-parse HEAD)}"
          dirty=false
          if [ -n "$(git status --porcelain)" ]; then dirty=true; fi
          cat > provenance.json <<EOF
          {
            "product": "dbpinball",
            "version": "$version",
            "commit": "$commit",
            "dirty": $dirty,
            "architecture": "x64",
            "platform": "linux",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "rustc": "$(rustc --version | sed 's/^rustc //')",
            "node": "$(node --version)",
            "artifacts": $(ls | grep -v '^provenance.json$' | grep -v '^SHA256SUMS.txt$' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          }
          EOF
          cat provenance.json

      - name: Verify the upload set is complete
        run: |
          set -euo pipefail
          dir="artifacts/release/v$RELEASE_VERSION"
          for name in \
            "dbpinball-cli-$RELEASE_VERSION-x64-linux.tar.gz" \
            "dbpinball_${RELEASE_VERSION}_amd64.deb" \
            "dbpinball_${RELEASE_VERSION}_amd64.AppImage" \
            "SHA256SUMS.txt" \
            "provenance.json"; do
            if [ ! -f "$dir/$name" ]; then
              echo "missing release file: $name" >&2
              exit 1
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbpinball-linux-x64
          # Upload only the files this release produced, not everything under
          # artifacts/release: a stale file from another run must never ship.
          path: |
            artifacts/release/v${{ env.RELEASE_VERSION }}/dbpinball-cli-${{ env.RELEASE_VERSION }}-x64-linux.tar.gz
            artifacts/release/v${{ env.RELEASE_VERSION }}/dbpinball_${{ env.RELEASE_VERSION }}_amd64.deb
            artifacts/release/v${{ env.RELEASE_VERSION }}/dbpinball_${{ env.RELEASE_VERSION }}_amd64.AppImage
            artifacts/release/v${{ env.RELEASE_VERSION }}/SHA256SUMS.txt
            artifacts/release/v${{ env.RELEASE_VERSION }}/provenance.json
          if-no-files-found: error
