name: Feature request
description: Propose a capability or improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the README first. Some capabilities are deliberately refused rather
        than missing — Safe Sync rejects non-MariaDB MySQL, non-InnoDB tables,
        triggers, foreign-key cycles and four unimplemented masking strategies.

        Proposals that conflict with the documented safety model will be discussed
        before implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop UI
        - Connection management
        - Query workspace
        - CLI
        - Safe Sync (PostgreSQL)
        - Safe Sync (MariaDB)
        - Masking policy
        - Documentation
        - Packaging and distribution
        - Other
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have read the README known limitations.
          required: true
        - label: This request does not require real production data to demonstrate.
          required: true
